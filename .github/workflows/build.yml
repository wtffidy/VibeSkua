name: Build VibeSkua

on:
  push:
    branches:
      - main
      - feature/advanced-stats-metrics
      - feature/client-intelligence-suite
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build solution (.NET 10 / Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore Skua.sln

      - name: Build solution
        run: dotnet build Skua.sln --configuration Release --no-restore --verbosity minimal

      - name: Package client and verify OMNISCOPE and portable Java
        shell: pwsh
        run: |
          ./package-build.ps1
          $pluginPath = Join-Path $PWD "Build/plugins/Skua.Plugin.Omniscope.dll"
          if (-not (Test-Path $pluginPath)) {
            throw "OMNISCOPE was not included in the packaged client: $pluginPath"
          }
          $javaPath = Join-Path $PWD "Build/FFDec/Runtime/bin/java.exe"
          if (-not (Test-Path $javaPath)) {
            throw "The private FFDec Java runtime was not included in the packaged client: $javaPath"
          }
          & $javaPath -version
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged FFDec Java runtime failed its startup check."
          }
          Get-Item $pluginPath, $javaPath | Format-List FullName, Length, LastWriteTimeUtc
