name: macOS Compatibility

on:
  push:
    branches:
      - feature/macos-support
    paths:
      - "Skua.App.Avalonia/**"
      - "Skua.Manager.Avalonia/**"
      - "Skua.Shared.Avalonia/**"
      - "Skua.Core/**"
      - "Skua.Core.Models/**"
      - "Skua.Core.Interfaces/**"
      - "Skua.Core.Utils/**"
      - "Skua.AS3/**"
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  pull_request:
    paths:
      - "Skua.App.Avalonia/**"
      - "Skua.Manager.Avalonia/**"
      - "Skua.Shared.Avalonia/**"
      - "Skua.Core/**"
      - "Skua.Core.Models/**"
      - "Skua.Core.Interfaces/**"
      - "Skua.Core.Utils/**"
      - "Skua.AS3/**"
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    name: .NET build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-26
          - target: x64
            rid: osx-x64
            rust_target: x86_64-apple-darwin
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Java for Flex compiler
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install PowerShell
        run: if ! command -v pwsh >/dev/null 2>&1; then brew install --cask powershell; fi

      - name: Install Apache Flex SDK
        run: |
          mkdir -p "$RUNNER_TEMP/flex"
          curl --fail --location --retry 3 https://dlcdn.apache.org/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz -o "$RUNNER_TEMP/apache-flex-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-flex-sdk.tar.gz" -C "$RUNNER_TEMP/flex"
          echo "FLEX_HOME=$RUNNER_TEMP/flex/apache-flex-sdk-4.16.1-bin" >> "$GITHUB_ENV"
          echo "PLAYERGLOBAL_HOME=$GITHUB_WORKSPACE/Skua.AS3/playerglobal" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flex/apache-flex-sdk-4.16.1-bin/bin" >> "$GITHUB_PATH"

      - name: Compile ActionScript
        run: pwsh -NoProfile -File Skua.AS3/compile-as3.ps1

      - name: Install Java for Ruffle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build client
        run: dotnet build Skua.App.Avalonia/Skua.App.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Build manager
        run: dotnet build Skua.Manager.Avalonia/Skua.Manager.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Build AS3 project
        run: dotnet build Skua.AS3/Skua.AS3.csproj --configuration Release

  ruffle-native-build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    name: Ruffle native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check native Ruffle bridge
        working-directory: Skua.Ruffle.Native
        run: cargo check --target ${{ matrix.target }}
