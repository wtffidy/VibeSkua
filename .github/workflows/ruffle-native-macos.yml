name: Ruffle Native macOS

on:
  push:
    branches:
      - feature/macos-support
    paths:
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  pull_request:
    paths:
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check native Ruffle bridge
        working-directory: Skua.Ruffle.Native
        run: cargo check --target ${{ matrix.target }}
