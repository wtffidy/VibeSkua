name: macOS Compatibility

on:
  push:
    branches:
      - feature/macos-support
    paths:
      - "Skua.App.Avalonia/**"
      - "Skua.Manager.Avalonia/**"
      - "Skua.Shared.Avalonia/**"
      - "Skua.Core/**"
      - "Skua.Core.Models/**"
      - "Skua.Core.Interfaces/**"
      - "Skua.Core.Utils/**"
      - "Skua.AS3/**"
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  pull_request:
    paths:
      - "Skua.App.Avalonia/**"
      - "Skua.Manager.Avalonia/**"
      - "Skua.Shared.Avalonia/**"
      - "Skua.Core/**"
      - "Skua.Core.Models/**"
      - "Skua.Core.Interfaces/**"
      - "Skua.Core.Utils/**"
      - "Skua.AS3/**"
      - "Skua.Ruffle.Native/**"
      - ".github/workflows/ruffle-native-macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    name: .NET build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm64
            rid: osx-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-26
          - target: x64
            rid: osx-x64
            rust_target: x86_64-apple-darwin
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Java for Flex compiler
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install PowerShell
        run: if ! command -v pwsh >/dev/null 2>&1; then brew install --cask powershell; fi

      - name: Install Apache Flex SDK
        run: |
          mkdir -p "$RUNNER_TEMP/flex"
          curl --fail --location --retry 3 https://dlcdn.apache.org/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz -o "$RUNNER_TEMP/apache-flex-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-flex-sdk.tar.gz" -C "$RUNNER_TEMP/flex"
          echo "FLEX_HOME=$RUNNER_TEMP/flex/apache-flex-sdk-4.16.1-bin" >> "$GITHUB_ENV"
          echo "PLAYERGLOBAL_HOME=$GITHUB_WORKSPACE/Skua.AS3/playerglobal" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flex/apache-flex-sdk-4.16.1-bin/bin" >> "$GITHUB_PATH"

      - name: Compile ActionScript
        run: pwsh -NoProfile -File Skua.AS3/compile-as3.ps1

      - name: Install Java for Ruffle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build client
        run: dotnet build Skua.App.Avalonia/Skua.App.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Verify packaged Ruffle native library
        env:
          RUNTIME_ID: ${{ matrix.rid }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          native_library="Skua.App.Avalonia/bin/Release/net10.0/${RUNTIME_ID}/Assemblies/runtimes/${RUNTIME_ID}/native/libskua_ruffle_native.dylib"
          test -f "$native_library"

          file "$native_library"
          case "$TARGET_ARCH" in
            arm64) file "$native_library" | grep -F "arm64" ;;
            x64) file "$native_library" | grep -F "x86_64" ;;
            *) echo "Unexpected target architecture: $TARGET_ARCH" >&2; exit 1 ;;
          esac

          otool -L "$native_library"

          mkdir -p "$RUNNER_TEMP/ruffle-native-smoke"
          cat > "$RUNNER_TEMP/ruffle-native-smoke/ruffle-native-smoke.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF

          cat > "$RUNNER_TEMP/ruffle-native-smoke/Program.cs" <<'EOF'
          using System;
          using System.Runtime.InteropServices;

          if (args.Length != 1)
              throw new ArgumentException("Expected the packaged Ruffle native library path.");

          nint library = NativeLibrary.Load(args[0]);
          try
          {
              string[] requiredExports =
              {
                  "skua_ruffle_session_create",
                  "skua_ruffle_session_tick",
                  "skua_ruffle_session_render",
                  "skua_ruffle_session_drain_callbacks",
                  "skua_ruffle_session_call",
                  "skua_ruffle_session_mouse_move",
                  "skua_ruffle_session_mouse_enter",
                  "skua_ruffle_session_mouse_down",
                  "skua_ruffle_session_mouse_up",
                  "skua_ruffle_session_mouse_wheel",
                  "skua_ruffle_session_mouse_leave",
                  "skua_ruffle_session_key",
                  "skua_ruffle_session_text_input",
                  "skua_ruffle_session_focus",
                  "skua_ruffle_session_allow_socket",
                  "skua_ruffle_session_resize",
                  "skua_ruffle_session_get_size",
                  "skua_ruffle_session_destroy"
              };

              foreach (string export in requiredExports)
                  if (!NativeLibrary.TryGetExport(library, export, out _))
                      throw new EntryPointNotFoundException($"Missing native export: {export}");

              Console.WriteLine($"Loaded {args[0]} and verified {requiredExports.Length} native exports.");
          }
          finally
          {
              NativeLibrary.Free(library);
          }
          EOF

          dotnet run --project "$RUNNER_TEMP/ruffle-native-smoke/ruffle-native-smoke.csproj" --configuration Release -- "$native_library"

      - name: Build manager
        run: dotnet build Skua.Manager.Avalonia/Skua.Manager.Avalonia.csproj --configuration Release --runtime ${{ matrix.rid }}

      - name: Build AS3 project
        run: dotnet build Skua.AS3/Skua.AS3.csproj --configuration Release

  ruffle-native-build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    name: Ruffle native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check native Ruffle bridge
        working-directory: Skua.Ruffle.Native
        run: cargo check --target ${{ matrix.target }}
